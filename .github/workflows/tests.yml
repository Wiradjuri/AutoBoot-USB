name: USB writer and GUI tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
      AUTOBOOT_NATIVE_DISK_TEST: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxtst6 libxkbfile1
      - name: Install application and lint tools
        run: python -m pip install -e . ruff
      - name: Check lint
        run: ruff check .
      - name: Test helper, simulated writer, downloads and real Qt GUI
        shell: bash
        env:
          # Windows runners are administrators: attach temporary VHDs and run
          # the production raw-disk writer and elevated helper against them.
          AUTOBOOT_NATIVE_DISK_TEST: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: |
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt
          exit "${PIPESTATUS[0]}"
      - name: Summarise test failures as annotations
        if: always()
        shell: bash
        run: python tools/ci_annotate.py test-output.txt
