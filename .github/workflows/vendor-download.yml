name: Live Microsoft download check
on:
  push:
    paths:
      - '.github/workflows/vendor-download.yml'
      - 'tools/check_microsoft_download.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  microsoft:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        system: ['win11', 'win10']
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Resolve public installer link and verify complete ISO
        run: python -m tools.check_microsoft_download ${{ matrix.system }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vendor-check-${{ matrix.system }}
          path: vendor-check.json
